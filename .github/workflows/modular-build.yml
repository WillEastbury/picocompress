name: Modular codec build

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ refactor/modular-codec-host ]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test modular host
        run: sh build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialise MSVC and build
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ toolchain not found' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $cmd = '"' + $devcmd + '" -arch=x64 && powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Windows modular build failed: $LASTEXITCODE" }
